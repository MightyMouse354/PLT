<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilot Life Course Support</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 6px;
      background: transparent;
      font-family: Avenir, Arial, sans-serif;
    }

    .support-card {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      background: #0b1d24;
      color: #ffffff;
      border-radius: 18px;
    }

    .label {
      margin: 0 0 12px;
      color: #ffc400;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .description {
      margin: 0 0 18px;
      color: #d5e5e6;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      display: block;
      padding: 15px 10px;
      border-radius: 12px;
      background: #ffc400;
      color: #0b1d24;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.3;
    }

    .button:hover { background: #ffda4d; }

    .button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <section class="support-card" aria-labelledby="support-title">
    <p class="label">New · Course Support</p>

    <h1 id="support-title">Support, made simpler.</h1>

    <p class="description">
      Need a hand? Our new support form makes it easy to contact
      the team, upload photos or screenshots of your workings,
      and keep your request in one place.
    </p>

    <a
      class="button"
      href="https://pilotlifeoperations.com/course-support/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Get Course Support &rarr;
    </a>
  </section>
</body>
</html>
